<div *ngIf="isVisible" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4 transform transition-all">
    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-gray-200">
      <div class="flex items-center space-x-3">
        <div class="text-2xl font-bold" [class]="getIconClass()">
          {{ getIcon() }}
        </div>
        <h3 class="text-lg font-semibold text-gray-900">{{ data.title }}</h3>
      </div>
    </div>

    <!-- Content -->
    <div class="p-6">
      <p class="text-gray-700 leading-relaxed">{{ data.message }}</p>
    </div>

    <!-- Footer -->
    <div class="flex justify-end space-x-3 p-6 border-t border-gray-200">
      <button 
        *ngIf="data.showCancelButton"
        (click)="onCancel()"
        class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-md transition-colors">
        {{ data.cancelText }}
      </button>
      <button 
        (click)="onConfirm()"
        class="px-4 py-2 text-sm font-medium rounded-md transition-colors"
        [class]="getButtonClass()">
        {{ data.confirmText }}
      </button>
    </div>
  </div>
</div>
