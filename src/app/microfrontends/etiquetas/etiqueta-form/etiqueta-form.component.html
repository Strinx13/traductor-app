<div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 modal-overlay">
  <div class="bg-white p-6 rounded-lg w-96 max-h-[90vh] overflow-y-auto form-container">
    <h3 class="text-lg font-bold mb-4">{{ modoEdicion ? 'Editar' : 'Agregar' }} Etiqueta</h3>
    <form (ngSubmit)="onGuardar()">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">Descripción</label>
        <input 
          type="text" 
          [(ngModel)]="etiqueta.descripcion_etiqueta" 
          name="descripcion_etiqueta" 
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
          required>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">Módulo</label>
        <select 
          [(ngModel)]="etiqueta.id_modulo" 
          name="id_modulo" 
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500" 
          [disabled]="!modoEdicion"
          required>
          <option [ngValue]="0">Seleccione un módulo</option>
          <option *ngFor="let modulo of modulos" [ngValue]="modulo.id_modulo">
            {{ modulo.nombre_modulo }}
          </option>
        </select>
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700">Porcentaje de Traducción</label>
        <input 
          type="number" 
          [(ngModel)]="etiqueta.porcentaje_traduccion" 
          name="porcentaje_traduccion" 
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
          min="0"
          max="100"
          required>
      </div>
      <div class="flex justify-end gap-2">
        <button 
          type="button" 
          (click)="onCancelar()" 
          class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-md">
          Cancelar
        </button>
        <button 
          type="submit" 
          class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-md">
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
